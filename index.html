  :root{
    --ink:#0B0B0C; --paper:#F6F5F1; --panel:#EEEBE3; --red:#B12B28;

  * { box-sizing: border-box; }

  .mono{ font-family:'IBM Plex Mono',monospace; }
  .eyebrow{ font-size:10.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--gray); }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }

  /* topbar */
  .topbar{ background:var(--ink); }
  .topbar-inner{ display:flex; align-items:center; justify-content:space-between; padding:16px 0; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .dot{ width:8px; height:8px; background:var(--red); }
  .brand .name{ color:#fff; font-weight:800; font-size:15px; letter-spacing:.22em; }
  .brand .sub{ color:var(--gray); font-size:11px; letter-spacing:.14em; text-transform:uppercase; margin-left:4px; }
  .topbar-right{ color:var(--gray); font-size:11px; letter-spacing:.1em; text-transform:uppercase; }

  /* filters */
  .filters{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:32px 32px; padding:24px 0; border-bottom:1px solid var(--line); }
  .field{ display:flex; flex-direction:column; gap:6px; min-width:168px; }
  .field select{
    appearance:none; background:transparent; border:none; border-bottom:1.5px solid var(--line);
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:500; color:var(--gray);
    padding:0 22px 6px 0; cursor:pointer; outline:none; width:100%;
  }
  .field select.active{ color:var(--ink); border-bottom-color:var(--red); }
  .field-wrap{ position:relative; }
  .field-wrap::after{
    content:''; position:absolute; right:2px; top:2px; width:9px; height:9px;
    border-right:1.5px solid var(--gray); border-bottom:1.5px solid var(--gray);
    transform:rotate(45deg); pointer-events:none;
  }
  .clear-btn{
    margin-left:auto; font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--red); border:none; background:none; border-bottom:1px solid var(--red); padding-bottom:6px; cursor:pointer;
    display:none;
  }

  /* KPI row */
  .kpis{ display:flex; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .kpi{ flex:1; min-width:150px; padding:16px 20px; border-right:1px solid var(--line); }
  .kpi:last-child{ border-right:none; }
  .kpi .val{ font-size:24px; font-weight:600; margin-top:6px; letter-spacing:-.02em; }
  .kpi .sub{ font-size:11.5px; color:var(--gray); margin-top:3px; }

  /* sections */
  .section{ margin-top:56px; }
  .section-title{ margin-bottom:4px; }
  .section-desc{ font-size:13px; color:var(--gray); margin:2px 0 18px; }

  .grid-top{ display:grid; grid-template-columns:1fr; gap:32px; margin-top:40px; }
  @media(min-width:1024px){ .grid-top{ grid-template-columns:2fr 1fr; } }

  .insight-panel{ background:var(--ink); padding:24px 24px 22px; height:100%; }
  .insight-panel .big{ color:#fff; font-size:34px; font-weight:600; margin-top:10px; line-height:1; }
  .insight-panel p{ color:#C9C7C0; font-size:13px; margin:12px 0 0; line-height:1.55; }
  .insight-panel strong{ color:#fff; }
  .insight-panel hr{ border:none; height:1px; background:#333; margin:18px 0; }

  .legend{ display:flex; flex-wrap:wrap; gap:8px 24px; margin-bottom:14px; }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--gray); }
  .legend-swatch{ width:10px; height:2.5px; }

  .leaderboard-row{ padding:12px 0; border-bottom:1px solid var(--line); }
  .leaderboard-row .top{ display:flex; align-items:baseline; justify-content:space-between; }
  .leaderboard-row .left{ display:flex; align-items:baseline; gap:12px; }
  .leaderboard-row .rank{ font-size:11px; font-weight:600; }
  .leaderboard-row .name{ font-size:14px; font-weight:500; }
  .leaderboard-row .count{ font-size:13px; font-weight:600; }
  .bar-track{ height:3px; background:var(--panel); margin-top:8px; }
  .bar-fill{ height:3px; }

  table{ width:100%; border-collapse:collapse; }
  thead tr{ border-bottom:1.5px solid var(--ink); }
  th{ text-align:left; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--gray); padding:0 0 10px; }
  th.r, td.r{ text-align:right; }
  tbody tr{ border-bottom:1px solid var(--line); }
  td{ font-size:13.5px; padding:11px 0; }
  td.gray{ color:var(--gray); }

  .cols-2{ display:grid; grid-template-columns:1fr; gap:40px; padding-bottom:64px; }
  @media(min-width:1024px){ .cols-2{ grid-template-columns:5fr 7fr; } }

  .footer{ display:flex; align-items:center; justify-content:space-between; padding:24px 0; border-top:1px solid var(--line); color:var(--gray); font-size:11px; }
  .footer .left{ display:flex; align-items:center; gap:8px; }
  .footer .gold-dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); }
  .footer .right{ letter-spacing:.08em; text-transform:uppercase; }

  .empty{ padding:96px 0; text-align:center; color:var(--gray); font-size:14px; }
  .chart-wrap{ position:relative; width:100%; }
  canvas{ width:100% !important; }
</style>
</head>

/* ------------------------------------------------------------------ */
/*  Tokens                                                             */
/* ------------------------------------------------------------------ */
const INK = "#0B0B0C", PAPER = "#F6F5F1", PANEL = "#EEEBE3", RED = "#B12B28",
      GOLD = "#C69632", GRAY = "#75736C", LINE = "#DCD8CC", LINE_DARK = "#2A2A2C";
const EVOLUTIVE_COLORS = [RED, GOLD, INK, "#8A8778", "#B7B3A6"];
const MONTHS_PT = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const fmtUSD = n => "US$ " + Math.round(n).toLocaleString("pt-BR");

/* ------------------------------------------------------------------ */
/*  Estado dos filtros                                                 */
/* ------------------------------------------------------------------ */
const state = { model: "Todos", year: "Todos", city: "Todos", pay: "Todos" };

function uniqueSorted(key, numeric=false){
  const vals = [...new Set(RAW_DATA.map(d => d[key]))];
  vals.sort(numeric ? (a,b)=>a-b : undefined);
  return ["Todos", ...vals];
}

function populateSelect(id, key, numeric=false){
  const el = document.getElementById(id);
  el.innerHTML = "";
  uniqueSorted(key, numeric).forEach(v => {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = v;
    el.appendChild(opt);
  });
}
populateSelect("f-model", "model");
populateSelect("f-year", "year", true);
populateSelect("f-city", "city");
populateSelect("f-pay", "pay");

const selModel = document.getElementById("f-model");
const selYear = document.getElementById("f-year");
const selCity = document.getElementById("f-city");
const selPay = document.getElementById("f-pay");
const clearBtn = document.getElementById("clearBtn");

function syncSelectStyles(){
  [ [selModel,state.model], [selYear,state.year], [selCity,state.city], [selPay,state.pay] ]
    .forEach(([el,val]) => el.classList.toggle("active", val !== "Todos"));
  const active = state.model!=="Todos" || state.year!=="Todos" || state.city!=="Todos" || state.pay!=="Todos";
  clearBtn.style.display = active ? "block" : "none";
}

[["change",selModel,"model"],["change",selYear,"year"],["change",selCity,"city"],["change",selPay,"pay"]]
  .forEach(([evt, el, key]) => el.addEventListener(evt, () => { state[key] = el.value; render(); }));

clearBtn.addEventListener("click", () => {
  state.model = state.year = state.city = state.pay = "Todos";
  selModel.value = selYear.value = selCity.value = selPay.value = "Todos";
  render();
});

/* ------------------------------------------------------------------ */
/*  Charts                                                             */
/* ------------------------------------------------------------------ */
let yearChart, areaChart, evoChart;
const darkTooltip = (unitFn) => ({
  backgroundColor: INK, borderColor: RED, borderWidth: 1, padding: 10,
  titleFont: { family: "IBM Plex Mono", size: 10.5, weight: "600" },
  titleColor: "#C9C7C0",
  bodyFont: { family: "IBM Plex Mono", size: 12, weight: "600" },
  bodyColor: "#fff",
  displayColors: false,
  callbacks: unitFn ? { label: unitFn } : undefined
});

/* ------------------------------------------------------------------ */
/*  Render principal                                                   */
/* ------------------------------------------------------------------ */
const content = document.getElementById("content");

function render(){
  syncSelectStyles();

  const filtered = RAW_DATA.filter(d =>
    (state.model === "Todos" || d.model === state.model) &&
    (state.year === "Todos" || String(d.year) === String(state.year)) &&
    (state.city === "Todos" || d.city === state.city) &&
    (state.pay === "Todos" || d.pay === state.pay)
  );

  if (filtered.length === 0){
    content.innerHTML = `<div class="empty"><div class="eyebrow" style="color:${RED}">Nenhum resultado</div>
      <div style="margin-top:8px;">Nenhuma venda corresponde à combinação de filtros selecionada.</div></div>`;
    return;
  }

  const n = filtered.length;
  const totalRevenue = filtered.reduce((s,d)=>s+d.price,0);
  const avgTicket = totalRevenue / n;

  const countBy = key => {
    const m = new Map();
    filtered.forEach(d => m.set(d[key], (m.get(d[key])||0)+1));
    return [...m.entries()].sort((a,b)=>b[1]-a[1]);
  };
  const byModel = countBy("model"), byCity = countBy("city"), byYear = countBy("year"), byState = countBy("state");
  const topModel = byModel[0], topCity = byCity[0], topYear = byYear[0], topState = byState[0];

  /* ---- Vendas por ano-modelo ---- */
  const allYears = uniqueSorted("year", true).filter(y => y !== "Todos");
  const yearMap = new Map(byYear);
  const yearLabels = allYears.map(String);
  const yearCounts = allYears.map(y => yearMap.get(y) || 0);
  const peakYear = topYear[0];

  /* ---- Evolução mensal ---- */
  const validDates = filtered.filter(d => d.date !== "INVALID").sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const invalidDateCount = n - validDates.length;
  const monthMap = new Map();
  validDates.forEach(d => {
    const key = d.date.slice(0,7);
    monthMap.set(key, (monthMap.get(key)||0)+1);
  });
  const monthEntries = [...monthMap.entries()].sort((a,b)=> a[0]<b[0]?-1:1);
  const monthLabels = monthEntries.map(([k]) => { const [y,m]=k.split("-"); return `${MONTHS_PT[+m-1]}/${y.slice(2)}`; });
  const monthCounts = monthEntries.map(([,c])=>c);

  /* ---- Evolução acumulada por state ---- */
  const topStates = byState.slice(0,4).map(([s])=>s);
  const hasOutros = byState.length > 4;
  const evoSeries = hasOutros ? [...topStates, "Outros"] : topStates;
  const byDate = new Map();
  validDates.forEach(d => { if(!byDate.has(d.date)) byDate.set(d.date, []); byDate.get(d.date).push(d); });
  const running = {}; evoSeries.forEach(s => running[s]=0);
  const evoLabels = [];
  const evoData = evoSeries.reduce((acc,s)=>{acc[s]=[];return acc;},{});
  [...byDate.entries()].forEach(([date, sales]) => {
    sales.forEach(s => { const key = topStates.includes(s.state) ? s.state : "Outros"; if(running[key]!==undefined) running[key]+=1; });
    const [y,m,day] = date.split("-");
    evoLabels.push(`${day}/${MONTHS_PT[+m-1]}/${y.slice(2)}`);
    evoSeries.forEach(s => evoData[s].push(running[s]));
  });

  /* ---- Modelo líder por cidade ---- */
  const cityGroups = new Map();
  filtered.forEach(d => { if(!cityGroups.has(d.city)) cityGroups.set(d.city, []); cityGroups.get(d.city).push(d); });
  const cityLeaderboard = [...cityGroups.entries()].map(([cityName, rows]) => {
    const mc = new Map(); rows.forEach(r => mc.set(r.model, (mc.get(r.model)||0)+1));
    const [topM, topCount] = [...mc.entries()].sort((a,b)=>b[1]-a[1])[0];
    return { city: cityName, total: rows.length, topModel: topM, share: Math.round((topCount/rows.length)*100) };
  }).sort((a,b)=>b.total-a.total).slice(0,8);

  /* ---- Leaderboard de modelos ---- */
  const modelLeaderboard = byModel.slice(0,6);
  const maxModelCount = modelLeaderboard.length ? modelLeaderboard[0][1] : 1;

  const insightCityModel = (cityLeaderboard.find(c => c.city === topCity[0]) || {}).topModel || topModel[0];

  /* ================= HTML ================= */
  content.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="eyebrow">Vendas</div><div class="val mono">${n}</div><div class="sub">de ${RAW_DATA.length} totais</div></div>
      <div class="kpi"><div class="eyebrow">Receita total</div><div class="val mono" style="color:${RED}">${fmtUSD(totalRevenue)}</div></div>
      <div class="kpi"><div class="eyebrow">Ticket médio</div><div class="val mono">${fmtUSD(avgTicket)}</div></div>
      <div class="kpi"><div class="eyebrow">Modelo líder</div><div class="val mono" style="font-size:18px">${topModel[0]}</div><div class="sub">${topModel[1]} unidade${topModel[1]>1?"s":""}</div></div>
      <div class="kpi"><div class="eyebrow">Ano-modelo líder</div><div class="val mono">${topYear[0]}</div><div class="sub">${topYear[1]} unidade${topYear[1]>1?"s":""}</div></div>
    </div>

    <div class="grid-top">
      <div>
        <div class="eyebrow section-title">Vendas por ano-modelo</div>
        <div class="section-desc">Qual ano-modelo mais saiu no período analisado</div>
        <div class="chart-wrap" style="height:260px;"><canvas id="yearChart"></canvas></div>
      </div>
      <div>
        <div class="insight-panel">
          <div class="eyebrow" style="color:${GOLD}">Insight</div>
          <div class="big mono">${peakYear}</div>
          <p>Ano-modelo com maior volume de vendas: <strong>${topYear[1]} unidades</strong> (${Math.round((topYear[1]/n)*100)}% do total filtrado).</p>
          <hr/>
          <p>Cidade líder: <strong>${topCity[0]}</strong> com ${topCity[1]} venda${topCity[1]>1?"s":""}, impulsionada principalmente por <strong>${insightCityModel}</strong>.</p>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="eyebrow section-title">Evolução de vendas no período</div>
      <div class="section-desc">Volume de vendas por mês, considerando datas válidas${invalidDateCount>0 ? ` (${invalidDateCount} registro${invalidDateCount>1?"s":""} com data inválida excluído${invalidDateCount>1?"s":""})` : ""}</div>
      ${monthEntries.length === 0
        ? `<div style="color:${GRAY};font-size:13px;padding:24px 0;">Nenhuma data válida disponível para os filtros selecionados.</div>`
        : `<div class="chart-wrap" style="height:200px;"><canvas id="areaChart"></canvas></div>`}
    </div>

    <div class="section">
      <div class="eyebrow section-title">Evolução de vendas por state</div>
      <div class="section-desc">Crescimento acumulado de unidades vendidas ao longo do tempo, por estado — mostra quais estados aceleram vendas mais rápido</div>
      ${evoLabels.length === 0
        ? `<div style="color:${GRAY};font-size:13px;padding:24px 0;">Nenhuma data válida disponível para os filtros selecionados.</div>`
        : `<div class="legend">${evoSeries.map((s,i)=>`
            <div class="legend-item">
              <div class="legend-swatch" style="background:${s==="Outros"?LINE_DARK:EVOLUTIVE_COLORS[i]};opacity:${s==="Outros"?0.4:1}"></div>${s}
            </div>`).join("")}</div>
           <div class="chart-wrap" style="height:280px;"><canvas id="evoChart"></canvas></div>`}
    </div>

    <div class="cols-2 section">
      <div>
        <div class="eyebrow section-title">Modelos mais vendidos</div>
        <div class="section-desc">Ranking geral sob os filtros atuais</div>
        <div>${modelLeaderboard.map(([m,c],i)=>`
          <div class="leaderboard-row">
            <div class="top">
              <div class="left"><span class="rank mono" style="color:${i===0?RED:GRAY}">${String(i+1).padStart(2,"0")}</span><span class="name">${m}</span></div>
              <span class="count mono" style="color:${i===0?RED:INK}">${c}</span>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width:${(c/maxModelCount)*100}%;background:${i===0?RED:INK}"></div></div>
          </div>`).join("")}</div>
      </div>
      <div>
        <div class="eyebrow section-title">Modelo líder por cidade</div>
        <div class="section-desc">As 8 cidades com maior volume e seu modelo mais popular</div>
        <table>
          <thead><tr><th>Cidade</th><th>Modelo popular</th><th class="r">Unid.</th><th class="r">Share</th></tr></thead>
          <tbody>${cityLeaderboard.map(r=>`
            <tr>
              <td>${r.city}</td>
              <td class="gray">${r.topModel}</td>
              <td class="r mono">${r.total}</td>
              <td class="r"><span class="mono" style="color:${r.share===100?RED:INK}">${r.share}%</span></td>
            </tr>`).join("")}</tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById("recordCount").textContent = `${n} de ${RAW_DATA.length} registros · EUA`;

  /* -------- gráfico ano-modelo -------- */
  if (yearChart) yearChart.destroy();
  yearChart = new Chart(document.getElementById("yearChart"), {
    type: "bar",
    data: { labels: yearLabels, datasets: [{ data: yearCounts,
      backgroundColor: yearLabels.map(y => y === String(peakYear) ? RED : INK), borderRadius: 2, maxBarThickness: 44 }] },
    options: { responsive:true, maintainAspectRatio:false,
      plugins: { legend:{display:false}, tooltip: darkTooltip(ctx=>`${ctx.parsed.y.toLocaleString("pt-BR")} un.`) },
      scales: {
        x: { grid:{display:false}, border:{color:LINE}, ticks:{font:{family:"IBM Plex Mono",size:11}, color:GRAY} },
        y: { grid:{color:LINE}, border:{display:false}, ticks:{font:{family:"IBM Plex Mono",size:11}, color:GRAY, precision:0} }
      } }
  });

  /* -------- gráfico evolução mensal -------- */
  if (areaChart) { areaChart.destroy(); areaChart = null; }
  if (monthEntries.length){
    areaChart = new Chart(document.getElementById("areaChart"), {
      type: "line",
      data: { labels: monthLabels, datasets: [{ data: monthCounts, borderColor: INK, borderWidth: 1.75,
        backgroundColor: "rgba(11,11,12,0.10)", fill: true, tension: 0.35,
        pointRadius: 2.5, pointBackgroundColor: INK, pointBorderWidth: 0,
        pointHoverRadius: 4.5, pointHoverBackgroundColor: RED }] },
      options: { responsive:true, maintainAspectRatio:false,
        plugins: { legend:{display:false}, tooltip: darkTooltip(ctx=>`${ctx.parsed.y} vendas`) },
        scales: {
          x: { grid:{display:false}, border:{color:LINE}, ticks:{font:{family:"IBM Plex Mono",size:10}, color:GRAY, maxRotation:0, autoSkip:true, maxTicksLimit:8} },
          y: { display:false }
        } }
    });
  }

  /* -------- gráfico evolutivo por state -------- */
  if (evoChart) { evoChart.destroy(); evoChart = null; }
  if (evoLabels.length){
    evoChart = new Chart(document.getElementById("evoChart"), {
      type: "line",
      data: { labels: evoLabels, datasets: evoSeries.map((s,i)=>({
        label: s, data: evoData[s],
        borderColor: s==="Outros" ? LINE_DARK : EVOLUTIVE_COLORS[i],
        borderWidth: s===topState[0] ? 2.25 : 1.5,
        borderDash: s==="Outros" ? [3,3] : undefined,
        stepped: true, pointRadius: 0, pointHoverRadius: 3.5, fill: false,
      })) },
      options: { responsive:true, maintainAspectRatio:false,
        plugins: { legend:{display:false},
          tooltip: { backgroundColor: INK, borderColor: RED, borderWidth: 1, padding: 10,
            titleFont: { family:"IBM Plex Mono", size:10.5, weight:"600" }, titleColor:"#C9C7C0",
            bodyFont: { family:"IBM Plex Mono", size:12, weight:"600" }, bodyColor:"#fff",
            itemSort:(a,b)=>b.parsed.y-a.parsed.y }
        },
        scales: {
          x: { grid:{display:false}, border:{color:LINE}, ticks:{font:{family:"IBM Plex Mono",size:10}, color:GRAY, maxRotation:0, autoSkip:true, maxTicksLimit:8} },
          y: { grid:{color:LINE}, border:{display:false}, ticks:{font:{family:"IBM Plex Mono",size:11}, color:GRAY, precision:0} }
        } }
    });
  }
}

render();
</script>
</body>
</html>
